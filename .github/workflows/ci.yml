name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies, no lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check
        run: npm run check
      - name: Test CLI and XDR parser
        run: npm test
